name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            arch: x86_64
          - runner: macos-15-intel
            os: Darwin
            arch: x86_64
          - runner: macos-15
            os: Darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check native identity
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          args=("$EXPECTED_OS" "$EXPECTED_ARCH")
          if [[ "$EXPECTED_OS" == Darwin ]]; then args+=(15); fi
          bash scripts/ci/check-native-host.sh "${args[@]}"
      - name: Prepare toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup toolchain install 1.88.0 --profile minimal
      - name: Prepare shared tools
        run: make install-tools
      - name: Verify tools
        run: make tools-check
      - name: Validate
        run: make ci
