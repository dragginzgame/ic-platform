name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Repository secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
      - name: Prepare pinned secret scanner
        run: |
          scanner="$(bash scripts/ci/install-ci-tool.sh gitleaks --install-dir "$RUNNER_TEMP/platform-ci-bin")"
          printf 'GITLEAKS_BIN=%s\n' "$scanner" >> "$GITHUB_ENV"
      - name: Save pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Scan complete repository history
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'

  selection:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Select qualification for the tested commit
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: |
          scope="$(perl scripts/ci/classify-ci-change.pl --event "$CHANGE_EVENT" --ref "$CHANGE_REF" --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --policy ci/docs-only-paths.txt)"
          case "$scope" in docs|full) ;; *) exit 1 ;; esac
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  native-provider-source:
    needs: selection
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate documentation only (no native qualification)
        if: needs.selection.outputs.scope == 'docs'
        run: make shared-tooling-check check-doc-links
      - name: Restore pinned tool downloads
        if: needs.selection.outputs.scope != 'docs'
        uses: ./.github/actions/cache-tool-downloads
      - name: Prepare native HTTP fixture toolchain
        if: needs.selection.outputs.scope != 'docs'
        run: rustup toolchain install --profile minimal --no-self-update --component clippy --component rustfmt
      - name: Prepare native HTTP manifest tools
        if: needs.selection.outputs.scope != 'docs'
        run: make install-host-tools
      - name: Save pinned tool downloads
        if: needs.selection.outputs.scope != 'docs'
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Prepare native HTTP fixture dependencies
        if: needs.selection.outputs.scope != 'docs'
        run: bash scripts/ci/check-native-profiler-http.sh --prepare
      - name: Qualify native source-provider assembly boundaries
        if: needs.selection.outputs.scope != 'docs'
        run: make check-native-provider

  platform:
    needs: selection
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            arch: x86_64
          - runner: macos-15-intel
            os: Darwin
            arch: x86_64
          - runner: macos-15
            os: Darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check native identity
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          args=("$EXPECTED_OS" "$EXPECTED_ARCH")
          if [[ "$EXPECTED_OS" == Darwin ]]; then args+=(15); fi
          bash scripts/ci/check-native-host.sh "${args[@]}"
      - name: Validate documentation only (no native qualification)
        if: needs.selection.outputs.scope == 'docs'
        run: make shared-tooling-check check-doc-links
      - name: Prepare toolchains
        if: needs.selection.outputs.scope != 'docs'
        run: |
          rustup toolchain install --profile minimal --no-self-update --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.selection.outputs.scope != 'docs'
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Prepare pinned npm
        if: needs.selection.outputs.scope != 'docs'
        run: npm install --global --ignore-scripts "$(node -p 'require("./scripts/fixtures/browser-compiler-floor/package.json").packageManager')"
      - name: Prepare and verify shared tools
        if: needs.selection.outputs.scope != 'docs'
        uses: ./.github/actions/prepare-common-tools
        with:
          cache: 'true'
          cache-save: 'true'
          cache-extra-key: ${{ hashFiles('ci/release-editor.env') }}
      - name: Prepare locked and standalone consumer dependencies
        if: needs.selection.outputs.scope != 'docs'
        run: |
          cargo fetch --locked
          make prepare-consumer-dependencies
      - name: Validate
        if: needs.selection.outputs.scope != 'docs'
        run: make ci
