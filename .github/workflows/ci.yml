name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native-provider-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare native HTTP fixture toolchain
        run: rustup toolchain install --profile minimal --no-self-update --component clippy --component rustfmt
      - name: Prepare native HTTP fixture dependencies
        run: bash scripts/ci/check-native-profiler-http.sh --prepare
      - name: Qualify native source-provider assembly boundaries
        run: make check-native-provider

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            arch: x86_64
          - runner: macos-15-intel
            os: Darwin
            arch: x86_64
          - runner: macos-15
            os: Darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check native identity
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          args=("$EXPECTED_OS" "$EXPECTED_ARCH")
          if [[ "$EXPECTED_OS" == Darwin ]]; then args+=(15); fi
          bash scripts/ci/check-native-host.sh "${args[@]}"
      - name: Prepare toolchains
        run: |
          rustup toolchain install --profile minimal --no-self-update --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Prepare pinned npm
        run: npm install --global --ignore-scripts "$(node -p 'require("./scripts/fixtures/browser-compiler-floor/package.json").packageManager')"
      - name: Prepare shared tools
        run: make install-tools
      - name: Verify tools
        run: make tools-check
      - name: Prepare declared MSRV
        run: rustup toolchain install "$(bash scripts/ci/read-platform-msrv.sh)" --profile minimal --target wasm32-unknown-unknown
      - name: Prepare locked and standalone consumer dependencies
        run: |
          cargo fetch --locked
          make prepare-consumer-dependencies
      - name: Validate
        run: make ci
