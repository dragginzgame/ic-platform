name: Installed runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Restore pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare compilers and tools
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
          make install-host-tools
          make install-rust-tools
          make install-ic-tools IC_TOOLS=ic-wasm
          printf '%s/.tools/ic/bin\n' "$PWD" >> "$GITHUB_PATH"
          bash scripts/ci/check-platform-compiler.sh
      - name: Save pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Prepare locked runtime dependencies
        run: |
          cargo fetch --locked
          bash scripts/ci/check-platform-runtime.sh --prepare
      - name: Prepare Testkit-owned server
        run: |
          source scripts/ci/workspace-dependencies.sh
          platform_dependencies_read "$PWD"
          version="$(platform_dependency_version ic-testkit)"
          compiler="$(bash scripts/ci/read-platform-msrv.sh)"
          cargo +"$compiler" install --version "=$version" --features cli --root target/testkit-cli ic-testkit --bin ic-testkit-server
          target/testkit-cli/bin/ic-testkit-server setup
          binary="$(target/testkit-cli/bin/ic-testkit-server check)"
          printf 'POCKET_IC_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Qualify both protocols and compiler versions
        run: make check-runtime
      - name: Retain qualification identities and results
        if: always()
        run: |
          for directory in target/cdk-runtime.*; do
            [[ -d "$directory" ]] || continue
            for file in qualification operation status source-revision source.sha256 compiler.txt artifacts.sha256 profiles.log; do
              if [[ -f "$directory/$file" ]]; then
                printf '\nEvidence: %s/%s\n' "$directory" "$file"
                cat "$directory/$file"
              fi
            done
          done
