name: Installed runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Runtime (${{ matrix.qualification }})
    strategy:
      fail-fast: false
      matrix:
        qualification: [owner, timers]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare compilers and tools
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
          make install-host-tools
          make install-rust-tools
          bash scripts/ci/check-platform-compiler.sh
          cargo fetch --locked
          selection=()
          if [[ '${{ matrix.qualification }}' == timers ]]; then selection=(--timers); fi
          bash scripts/ci/check-platform-runtime.sh "${selection[@]}" --prepare
          if [[ '${{ matrix.qualification }}' == timers ]]; then
            bash scripts/ci/test-runtime-independence.sh --prepare
          fi
      - name: Prepare Testkit-owned server
        run: |
          version="$(.tools/host/bin/yq -p toml -r '.workspace.dependencies.ic-testkit' Cargo.toml)"
          compiler="$(bash scripts/ci/read-platform-msrv.sh)"
          cargo +"$compiler" install --locked --version "=$version" --features cli --root target/testkit-cli ic-testkit --bin ic-testkit-server
          target/testkit-cli/bin/ic-testkit-server setup
          binary="$(target/testkit-cli/bin/ic-testkit-server check)"
          printf 'POCKET_IC_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Refuse incompatible composition without failing owner graphs
        if: matrix.qualification == 'timers'
        run: make check-runtime-independence
      - name: Qualify both protocols and compiler versions
        run: |
          if [[ '${{ matrix.qualification }}' == timers ]]; then
            make check-runtime-composition
          else
            make check-runtime
          fi
      - name: Retain qualification identities and results
        if: always()
        run: |
          for directory in target/cdk-runtime.*; do
            [[ -d "$directory" ]] || continue
            for file in qualification operation status source-revision source.sha256 compiler.txt artifacts.sha256 profiles.log; do
              if [[ -f "$directory/$file" ]]; then
                printf '\nEvidence: %s/%s\n' "$directory" "$file"
                cat "$directory/$file"
              fi
            done
          done
