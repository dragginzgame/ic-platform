name: Release validation qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-validation.yml
      - ci/release-validation.json
      - Makefile
      - scripts/release/validation-*
      - scripts/release/qualify-*
      - scripts/release/adapter.sh
      - scripts/ci/test-platform-validation-*

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            arch: x86_64
          - runner: macos-15-intel
            os: Darwin
            arch: x86_64
          - runner: macos-15
            os: Darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check native identity
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          args=("$EXPECTED_OS" "$EXPECTED_ARCH")
          if [[ "$EXPECTED_OS" == Darwin ]]; then args+=(15); fi
          bash scripts/ci/check-native-host.sh "${args[@]}"
      - name: Prepare compiler
        run: |
          rustup toolchain install --profile minimal --no-self-update --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Prepare tools and dependencies
        run: |
          npm install --global --ignore-scripts "$(node -p 'require("./scripts/fixtures/browser-compiler-floor/package.json").packageManager')"
          make install-tools
          make tools-check
          cargo fetch --locked
          make prepare-consumer-dependencies
          bash scripts/ci/check-platform-runtime.sh --prepare
          bash scripts/ci/check-platform-runtime.sh --timers --prepare
      - name: Prepare Testkit-owned server
        run: |
          version="$(.tools/host/bin/yq -p toml -r '.workspace.dependencies.ic-testkit' Cargo.toml)"
          compiler="$(bash scripts/ci/read-platform-msrv.sh)"
          cargo +"$compiler" install --locked --version "=$version" --features cli --root target/testkit-cli ic-testkit --bin ic-testkit-server
          target/testkit-cli/bin/ic-testkit-server setup
          binary="$(target/testkit-cli/bin/ic-testkit-server check)"
          printf 'POCKET_IC_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Qualify real full and selected mappings
        run: bash scripts/release/qualify-native-validation.sh
      - name: Retain source, receipts, logs and installed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release-validation-native.*/evidence/
          if-no-files-found: warn
