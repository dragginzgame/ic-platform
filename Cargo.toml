[workspace]
members = [
    "crates/ic-platform",
    "crates/ic-platform-macros",
    "crates/ic-platform-pocket-ic",
    "crates/ic-platform-runtime",
    "crates/ic-platform-runtime-guard",
    "crates/ic-platform-types",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-platform"

[workspace.dependencies]
# Production dependencies

# Platform
# Changelog : releases/platform/CHANGELOG.md
ic-platform = { version = "0.18.0", path = "crates/ic-platform", default-features = false }

# PocketIC
# Changelog : releases/pocket-ic/CHANGELOG.md
ic-platform-pocket-ic = { version = "0.18.0", path = "crates/ic-platform-pocket-ic", default-features = false }

# Runtime
# Changelog : releases/runtime/CHANGELOG.md
ic-platform-macros = { version = "0.18.1", path = "crates/ic-platform-macros" }
ic-platform-runtime = { version = "0.18.1", path = "crates/ic-platform-runtime", default-features = false }
ic-platform-runtime-guard = { version = "=0.18.1", path = "crates/ic-platform-runtime-guard", default-features = false }

# Types
# Changelog : releases/types/CHANGELOG.md
ic-platform-types = { version = "0.17.0", path = "crates/ic-platform-types", default-features = false }

# External production dependencies
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
candid = { version = "0.10.38", default-features = false }
crc32fast = "1.5"
# Published ECDSA security floor; older consumer locks must not retain 0.7.5.
crypto-bigint = { version = "0.7.10", default-features = false }
curve25519-dalek = { version = "5.0.0", default-features = false }
data-encoding = "2.11"
digest = "0.10"
ed25519-dalek = { version = "3.0.0", default-features = false }
ff = { version = "0.13", default-features = false }
group = { version = "0.13", default-features = false, features = ["alloc"] }
hex = "0.4.3"
ic_principal = { version = "0.1.5", default-features = false, features = ["convert"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
pairing = { version = "0.23.0", default-features = false }
pin-project-lite = "0.2.17"
rand_core = { version = "0.6", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha2 = "0.10"
# Owned Principal can use the current provider; BLS still requires Digest 0.10.
sha2_11 = { package = "sha2", version = "0.11.1", default-features = false }
slotmap = "1.1.1"
subtle = { version = "2.6", default-features = false }
thiserror = "2.0.18"

# External native-only production adapters
backon = { version = "1.6.0", default-features = false, features = ["std"] }
base64 = "0.23.1"
candid_parser = { version = "0.4.1", default-features = false }
flate2 = "1.0.31"
ic-agent = { version = "0.49.2", default-features = false, features = ["pem"] }
ic-certification = { version = "3.2.0", default-features = false, features = ["serde"] }
ic-management-canister-types = "=0.11.0"
ic-secp256k1 = "=0.3.0"
ic-transport-types = "0.49.1"
reqwest = { version = "0.13", default-features = false }
schemars = { version = "0.8.21", features = ["derive"] }
semver = { version = "1.0.9", features = ["serde"] }
slog = "2.7.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
tempfile = "3.20"
tokio = { version = "1.42.0", default-features = false }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json", "time"] }

# External proc-macro dependencies (compiler host)
proc-macro2 = "1.0.106"
quote = "1"
syn = { version = "3", features = ["full"] }

# External mixed production/test dependencies
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"
serde_json = "1.0"

# Tests and tooling only
ic-representation-independent-hash = "4.0.1"
ic-testkit = "0.72.0"
# Qualification-only committed adoption source; return to a registry selection
# after the independent Runtime and matching Timers releases are published.
ic-timers = { version = "0.37.0", git = "https://github.com/dragginzgame/ic-scheduling", rev = "1c57a6d9abfd432fc683c5016d4625763682483a" }
ic-wire = "0.10.0"
libfuzzer-sys = "0.4.13"
rand = "0.8"
rand_xorshift = "0.3"
serde_test = "1.0.177"
sha3 = "0.10"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
