[workspace]
members = ["crates/ic-platform"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-platform"

[workspace.dependencies]
candid = { version = "0.10.38", default-features = false }
ic-cdk-executor = "2.0.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
