[workspace]
members = ["crates/ic-platform", "crates/ic-platform-macros"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-platform"

[workspace.dependencies]

# Production dependencies
candid = { version = "0.10.38", default-features = false }
candid_parser = { version = "0.4.1", default-features = false }
crc32fast = "1.5"
curve25519-dalek = { version = "4.1.3", default-features = false }
data-encoding = "2.11"
ed25519-dalek = { version = "2.2", default-features = false }
ic-agent = { version = "0.49.2", default-features = false, features = ["pem"] }
ic-cdk-executor = "=2.0.0"
ic-certification = { version = "3.2.0", default-features = false, features = ["serde"] }
ic-management-canister-types = "=0.11.0"
ic-platform-macros = { version = "0.4.1", path = "crates/ic-platform-macros" }
ic-representation-independent-hash = "3.0"
ic-secp256k1 = "=0.3.0"
ic-verify-bls-signature = { version = "0.6.0", default-features = false, features = ["alloc"] }
ic0 = "=1.2.0"
ic_principal = { version = "0.1.5", default-features = false, features = ["convert", "self_authenticating", "serde"] }
icrc-ledger-types = { version = "0.2.0", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
lazy_static = "1.4"
pin-project-lite = "0.2.17"
pocket-ic = "16.1.0"
proc-macro2 = "1.0.106"
quote = "1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"
sha2 = "0.10"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2.0.18"

# Tests and tooling only
assert_matches = "1.5"
ic-testkit = "0.54.1"
ic-timers = "0.29.1"
ic-wire = "0.4.7"
libfuzzer-sys = "0.4.13"
serde_test = "1.0.177"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
