# Release groups: ci/cargo-release-groups.json
# platform: ic-platform, ic-platform-macros, ic-platform-runtime-guard
#   version: crates/ic-platform/Cargo.toml package.version
#   changelog: releases/platform/CHANGELOG.md
# types: ic-platform-types
#   version: crates/ic-platform-types/Cargo.toml package.version
#   changelog: releases/types/CHANGELOG.md
[workspace]
members = [
    "crates/ic-platform",
    "crates/ic-platform-macros",
    "crates/ic-platform-runtime-guard",
    "crates/ic-platform-types",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-platform"

[workspace.dependencies]

# Production dependencies
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
candid = { version = "0.10.38", default-features = false }
candid_parser = { version = "0.4.1", default-features = false }
crc32fast = "1.5"
curve25519-dalek = { version = "4.1.3", default-features = false }
data-encoding = "2.11"
ed25519-dalek = { version = "2.2", default-features = false }
hex = "0.4.3"
ic-agent = { version = "0.49.2", default-features = false, features = ["pem"] }
ic-certification = { version = "3.2.0", default-features = false, features = ["serde"] }
ic-management-canister-types = "=0.11.0"
ic-platform-macros = { version = "0.15.1", path = "crates/ic-platform-macros" }
ic-platform-runtime-guard = { version = "=0.15.1", path = "crates/ic-platform-runtime-guard", default-features = false }
ic-platform-types = { version = "0.15.0", path = "crates/ic-platform-types", default-features = false }
ic-secp256k1 = "=0.3.0"
ic-stable-structures = { version = "=0.7.2", default-features = false }
ic-verify-bls-signature = { version = "0.6.0", default-features = false, features = ["alloc"] }
ic_principal = { version = "0.1.5", default-features = false, features = ["convert"] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
pin-project-lite = "0.2.17"
pocket-ic = "16.1.0"
proc-macro2 = "1.0.106"
quote = "1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"
sha2 = "0.10"
slotmap = "1.1.1"
syn = { version = "2", features = ["full"] }
thiserror = "2.0.18"

# Tests and tooling only
assert_matches = "1.5"
ic-representation-independent-hash = "3.0"
ic-testkit = "0.72.0"
ic-timers = "0.32.3"
ic-wire = "0.10.0"
libfuzzer-sys = "0.4.13"
serde_test = "1.0.177"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
