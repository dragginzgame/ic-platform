[workspace]
members = ["crates/ic-platform"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-platform"

# Tests and tooling only: none; tests reuse the production dependency catalog.
[workspace.dependencies]
candid = { version = "0.10.38", default-features = false }
candid_parser = { version = "0.4.1", default-features = false } # Production dependency, native host capability only
ic-cdk-executor = "2.0.0"
ic-certification = { version = "3.2.0", default-features = false, features = ["serde"] }
ic_principal = "0.1.5" # Production dependencies
serde = { version = "1.0", default-features = false, features = ["derive"] } # Production dependencies

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
