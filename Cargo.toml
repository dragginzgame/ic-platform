[workspace]
members = [
    "crates/ic-platform",
    "crates/ic-platform-macros",
    "crates/ic-platform-protocol",
    "crates/ic-platform-runtime",
    "crates/ic-platform-runtime-guard",
    "crates/ic-platform-types",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"

[workspace.dependencies]
# Production
candidate-macros = { package = "ic-platform-macros", path = "crates/ic-platform-macros", version = "=0.23.17", default-features = false }
candidate-runtime-guard = { package = "ic-platform-runtime-guard", path = "crates/ic-platform-runtime-guard", version = "=0.23.17", default-features = false }
candidate-types = { package = "ic-platform-types", path = "crates/ic-platform-types", version = "0.21.2", default-features = false }
crc32fast = "1.5.5"
crypto-bigint = { version = "0.7.11", default-features = false }
curve25519-dalek = { version = "=5.0.0", default-features = false }
data-encoding = "2.11.0"
ed25519-dalek = { version = "=3.0.0", default-features = false }
ic-certification = { version = "=3.2.0", default-features = false }
ic-stable-structures = { version = "0.7.2", default-features = false }
ic-transport-types = "0.49.3"
ic-verify-bls-signature = { version = "=0.6.0", default-features = false, features = ["alloc"] }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
num-bigint = { version = "0.5.1", default-features = false, features = ["serde"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"
sha2 = { version = "0.11.1", default-features = false }
spki = { version = "0.8.1", default-features = false }
syn = { version = "3.0.10", features = ["full"] }
thiserror = "2.0.18"

# Tests and tooling
ic_bls12_381 = { version = "=0.10.1", default-features = false, features = ["groups"] }
serde_json = "1.0.154"
serde_test = "1.0.177"
toko-tooling = "=0.45.7"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
