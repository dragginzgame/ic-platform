[workspace]
members = [
    "crates/ic-platform",
    "crates/ic-platform-macros",
    "crates/ic-platform-runtime",
    "crates/ic-platform-runtime-guard",
    "crates/ic-platform-types",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-platform"

[workspace.dependencies]

ic-platform-macros = { version = "0.22.1", path = "crates/ic-platform-macros" }
ic-platform-runtime = { version = "0.22.1", path = "crates/ic-platform-runtime", default-features = false }
ic-platform-runtime-guard = { version = "=0.22.1", path = "crates/ic-platform-runtime-guard", default-features = false }

ic-platform-types = { version = "0.20.1", path = "crates/ic-platform-types", default-features = false }

crc32fast = "1.5"
# Published ECDSA security floor; older consumer locks must not retain 0.7.5.
crypto-bigint = { version = "0.7.10", default-features = false }
curve25519-dalek = { version = "5.0.0", default-features = false }
data-encoding = { version = "2.11", default-features = false, features = ["alloc"] }
# Trait compatibility for the external curve supplier; hashing uses SHA-2 0.11.
digest_10 = { package = "digest", version = "0.10.7", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
hex = "0.4.3"
ic-certification = { version = "3.2.0", default-features = false, features = ["serde"] }
ic0 = { version = "1.2.0", default-features = false }
ic_bls12_381 = { version = "0.10.1", default-features = false, features = ["alloc", "groups", "pairings", "experimental"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
pin-project-lite = "0.2.17"
serde = { version = "1.0", default-features = false, features = ["derive"] }
# Owned Principal, ledger and BLS hashing share this provider; the curve retains Digest 0.10.
sha2_11 = { package = "sha2", version = "0.11.1", default-features = false }
slotmap = "1.1.1"
thiserror = "2.0.18"

serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
serde_cbor = "0.11.2"

ic-agent = { version = "0.49.2", default-features = false, features = ["pem"] }
ic-transport-types = "0.49.1"

proc-macro2 = "1.0.106"
quote = "1"
syn = { version = "3", features = ["full"] }

binrw = { version = "0.15.2", default-features = false, features = ["std"] }
candid = { version = "0.10.38", default-features = false }
ic-canister-sig-creation = { version = "1.3.1", default-features = false }
ic-management-canister-types = "=0.11.0"
ic-signature-verification = { version = "0.3.0", default-features = false }
ic-verify-bls-signature = { version = "0.6.0", default-features = false, features = ["alloc"] }
ic_principal = { version = "0.1.5", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1.0"
serde_test = "1.0.177"
toko-tooling = "=0.42.4"

# Inputs to generated standalone fixtures, not dependencies of product members.
[workspace.metadata.platform-fixtures.dependencies]
ic-testkit = { version = "0.102.0", default-features = false }
ic-wire = "0.10.0"
libfuzzer-sys = "0.4.13"
tokio = { version = "1", features = ["rt", "net", "time"] }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
