[package]
name = "engine-view-wasm"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[[bin]]
name = "registry-admission"
path = "src/bin/registry-admission.rs"
required-features = ["registry-settings"]

[[bin]]
name = "marketplace-admission"
path = "src/bin/marketplace-admission.rs"
required-features = ["marketplace"]

[[bin]]
name = "raw-rand-admission"
path = "src/bin/raw-rand-admission.rs"
required-features = ["raw-rand"]

[[bin]]
name = "management-chunks-admission"
path = "src/bin/management-chunks-admission.rs"
required-features = ["management-chunks"]

[[bin]]
name = "management-snapshots-admission"
path = "src/bin/management-snapshots-admission.rs"
required-features = ["management-snapshots"]

[[bin]]
name = "caffeine-admission"
path = "src/bin/caffeine-admission.rs"
required-features = ["caffeine"]

[[bin]]
name = "ledger-admission"
path = "src/bin/ledger-admission.rs"
required-features = ["ledger"]

[[bin]]
name = "sns-admission"
path = "src/bin/sns-admission.rs"
required-features = ["sns-neurons"]

[features]
sns-neurons = [
    "candidate",
    "ic-platform-protocol/sns-neurons",
    "ic-platform-protocol/ledger",
]
ledger = ["candidate", "ic-platform-protocol/ledger"]
caffeine = ["candidate", "ic-platform-protocol/caffeine"]
management-snapshots = ["candidate", "ic-platform-protocol/management-snapshots"]
default = []
management-chunks = ["candidate", "ic-platform-protocol/management-chunks"]
raw-rand = ["candidate", "ic-platform-protocol/raw-rand"]
candidate = ["dep:ic-platform-protocol"]
registry-settings = [
    "candidate",
    "ic-platform-protocol/registry",
    "ic-platform-protocol/registry-placement",
]
marketplace = ["candidate", "ic-platform-protocol/cloud-engine-marketplace"]

[dependencies]
ic-platform-protocol = { workspace = true, optional = true }

[lints]
workspace = true
