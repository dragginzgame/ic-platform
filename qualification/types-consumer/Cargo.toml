[package]
name = "types-consumer"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-platform-types.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[[bin]]
name = "runtime-arguments"
path = "src/bin/runtime-arguments.rs"
required-features = ["runtime-ic0"]

[[bin]]
name = "runtime-entrypoints"
path = "src/bin/runtime-entrypoints.rs"
required-features = ["runtime-ic0"]

[[bin]]
name = "runtime-awaited"
path = "src/bin/runtime-awaited.rs"
required-features = ["runtime-ic0"]

[features]
default = []
runtime-call = ["dep:candidate-runtime", "candidate-runtime/call"]
runtime-ic0 = ["runtime-call", "candidate-runtime/call-ic0"]
self-authentication = [
    "candidate-types/principal-self-authenticating",
    "ic-platform-types/principal-self-authenticating",
]

[dependencies]
candidate-runtime = { workspace = true, optional = true }
candidate-types.workspace = true
serde_json.workspace = true

[lints]
workspace = true
