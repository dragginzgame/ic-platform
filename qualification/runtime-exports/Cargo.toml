[package]
name = "runtime-exports"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
candidate-runtime.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["generated"]
generated = ["candidate-runtime/entrypoint-macros"]
raw = ["candidate-runtime/system-raw"]

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
