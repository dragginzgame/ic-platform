[workspace]
members = [
    "engine-view-consumer",
    "engine-view-profile",
    "engine-view-wasm",
    "platform-certificates",
    "platform-qualification-server",
    "runtime-exports",
    "runtime-installed",
    "runtime-rollback",
    "types-consumer",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
base64 = "0.23.1"
candid = "0.10.40"
candidate-platform = { package = "ic-platform", path = "../crates/ic-platform", version = "=0.34.18", default-features = false }
candidate-runtime = { package = "ic-platform-runtime", path = "../crates/ic-platform-runtime", version = "=0.23.22", default-features = false }
candidate-types = { package = "ic-platform-types", path = "../crates/ic-platform-types", version = "0.21.3", default-features = false }
dhat = "0.3.3"
engine-view-consumer = { path = "engine-view-consumer" }
ic-certification = { version = "=3.2.0", default-features = false }
ic-host-process = "0.81.0"
ic-management-canister-types = "0.8.0"
ic-platform-protocol = { path = "../crates/ic-platform-protocol", default-features = false, features = ["cloud-engine-response"] }
ic-platform-types = { version = "0.21.2", default-features = false }
ic-testkit = { version = "0.110.0", default-features = false }
published-platform = { package = "ic-platform", version = "0.34.12", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
toko-tooling = "=0.45.19"
wat = "1.263.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ic_platform_qualification_accounting)'] }
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
