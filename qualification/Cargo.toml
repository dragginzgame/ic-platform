[workspace]
members = [
    "crates/engine-view-profile",
    "crates/engine-view-wasm",
    "crates/types-consumer",
    "engine-view-consumer",
    "runtime-exports",
    "runtime-installed",
    "runtime-rollback",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
candid = "0.10.40"
candidate-runtime = { package = "ic-platform-runtime", path = "../crates/ic-platform-runtime", version = "=0.23.7", default-features = false }
candidate-types = { package = "ic-platform-types", path = "../crates/ic-platform-types", version = "=0.21.0", default-features = false }
dhat = "0.3.3"
ic-management-canister-types = "0.8.0"
ic-platform = { version = "0.33.7", default-features = false, features = ["cloud-engine-types"] }
ic-platform-protocol = { path = "../crates/ic-platform-protocol", default-features = false, features = ["cloud-engine-response"] }
ic-platform-types = { version = "0.20.4", default-features = false }
ic-testkit = { version = "0.106.0", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
toko-tooling = "=0.44.4"
wat = "=1.263.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
