[workspace]
members = ["bls-probe"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
repository = "https://github.com/dragginzgame/ic-platform"
publish = false

[workspace.dependencies]
ic-platform = { path = "../crates/ic-platform", default-features = false, features = ["bls"] }
ic-platform-runtime = { path = "../crates/ic-platform-runtime", default-features = false, features = ["ic0"] }
ic-testkit = { version = "0.101.0", default-features = false }
ic-verify-bls-signature = { version = "0.6.0", default-features = false, features = ["alloc"] }
platform-baseline = { package = "ic-platform", version = "=0.31.3", default-features = false, features = ["bls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
toko-tooling = "=0.40.1"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
