[package]
name = "platform-certificates"
version = "0.1.0"
publish = false
default-run = "platform-certificates"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
candid.workspace = true
ic-testkit.workspace = true
tokio.workspace = true
wat.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[[bin]]
name = "auth-admission"
path = "src/bin/auth-admission.rs"
required-features = ["auth-consumer"]

[[bin]]
name = "signature-observed"
path = "src/bin/signature-observed.rs"
required-features = ["canister-signature"]

[[bin]]
name = "signature-admission"
path = "src/bin/signature-admission.rs"
required-features = ["canister-signature"]

[[bin]]
name = "crypto-admission"
path = "src/bin/crypto-admission.rs"
required-features = ["crypto"]

[features]
crypto = ["candidate-platform/ed25519", "candidate-platform/ecdsa"]
auth-consumer = ["canister-signature", "dep:sha2"]
canister-signature = [
    "candidate-platform/canister-signature-authentication",
    "dep:serde_cbor",
    "ic-certification/serde",
]

[dependencies]
candidate-platform = { workspace = true, features = ["certificate-authentication"] }
candidate-types.workspace = true
ic-certification.workspace = true
serde_cbor = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[lints]
workspace = true
