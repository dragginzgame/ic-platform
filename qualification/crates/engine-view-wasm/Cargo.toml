[package]
name = "engine-view-wasm"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "registry-admission"
path = "src/bin/registry-admission.rs"
required-features = ["registry-settings"]

[[bin]]
name = "marketplace-admission"
path = "src/bin/marketplace-admission.rs"
required-features = ["marketplace"]

[features]
default = []
candidate = ["dep:ic-platform-protocol"]
published = ["dep:ic-platform"]
registry-settings = ["candidate", "ic-platform-protocol/registry-settings"]
marketplace = ["candidate", "ic-platform-protocol/cloud-engine-marketplace"]

[dependencies]
ic-platform = { workspace = true, optional = true }
ic-platform-protocol = { workspace = true, optional = true }

[lints]
workspace = true
