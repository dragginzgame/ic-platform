[package]
name = "platform-certificates"
version = "0.1.0"
publish = false
default-run = "platform-certificates"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[[bin]]
name = "auth-admission"
path = "src/bin/auth-admission.rs"
required-features = ["auth-consumer"]

[[bin]]
name = "signature-observed"
path = "src/bin/signature-observed.rs"
required-features = ["canister-signature"]

[[bin]]
name = "signature-admission"
path = "src/bin/signature-admission.rs"
required-features = ["canister-signature"]

[[bin]]
name = "crypto-admission"
path = "src/bin/crypto-admission.rs"
required-features = ["crypto"]

[[bin]]
name = "native-read"
path = "src/bin/native-read.rs"
required-features = ["native-read"]

[[bin]]
name = "native-signed-installed"
path = "src/bin/native-signed-installed.rs"
required-features = ["native-signed"]

[[bin]]
name = "native-anonymous-installed"
path = "src/bin/native-anonymous-installed.rs"
required-features = ["native-signed"]

[features]
native-signed-secp256k1 = ["native-signed", "candidate-platform/native-signed-secp256k1"]
native-signed = [
    "dep:base64",
    "dep:ic-host-process",
    "dep:serde_json",
    "dep:tempfile",
    "dep:ic-platform-protocol",
    "native-read",
    "candidate-platform/native-signed",
    "candidate-platform/certificate-construction",
    "candidate-platform/certificate-fixture-signing",
    "dep:serde_cbor",
]
native-read = ["candidate-platform/native-read"]
crypto = ["candidate-platform/ed25519", "candidate-platform/ecdsa"]
auth-consumer = ["canister-signature", "dep:sha2"]
canister-signature = [
    "candidate-platform/canister-signature-authentication",
    "dep:serde_cbor",
    "ic-certification/serde",
]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
base64 = { workspace = true, optional = true }
candid.workspace = true
ic-host-process = { workspace = true, optional = true }
ic-platform-protocol = { workspace = true, optional = true, features = ["management"] }
ic-testkit.workspace = true
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio.workspace = true
wat.workspace = true

[dependencies]
candidate-platform = { workspace = true, features = ["certificate-authentication"] }
candidate-types.workspace = true
ic-certification.workspace = true
serde_cbor = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
