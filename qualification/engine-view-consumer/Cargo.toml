[package]
name = "engine-view-consumer"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-platform.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
marketplace = ["ic-platform-protocol/cloud-engine-marketplace"]
registry-settings = ["ic-platform-protocol/registry-settings", "ic-platform/nns-registry-types"]

[dependencies]
ic-platform-protocol.workspace = true
ic-platform-types.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
