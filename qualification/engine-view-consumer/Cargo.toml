[package]
name = "engine-view-consumer"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-platform-types.workspace = true
legacy-platform.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
http-request = [
    "ic-platform-protocol/http-request",
    "dep:candid",
    "dep:ic-management-canister-types",
    "legacy-platform/management-canister-types",
    "legacy-platform/candid-codec",
]
marketplace = ["ic-platform-protocol/cloud-engine-marketplace"]
registry-settings = [
    "ic-platform-protocol/registry-settings",
    "legacy-platform/nns-registry-types",
]

[dependencies]
candid = { workspace = true, optional = true }
candidate-types.workspace = true
ic-management-canister-types = { workspace = true, optional = true }
ic-platform-protocol.workspace = true

[dev-dependencies]
candidate-runtime = { workspace = true, features = ["call"] }
serde_json.workspace = true

[lints]
workspace = true
