[package]
name = "engine-view-consumer"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
candid.workspace = true
serde.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-management-canister-types.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[features]
sns-neurons = ["ic-platform-protocol/sns-neurons", "ic-platform-protocol/ledger"]
ledger = ["ic-platform-protocol/ledger"]
caffeine = ["ic-platform-protocol/caffeine"]
management-snapshots = ["ic-platform-protocol/management-snapshot-fixtures"]
management-chunks = ["ic-platform-protocol/management-chunks"]
raw-rand = ["ic-platform-protocol/raw-rand"]
http-request = ["ic-platform-protocol/http-request"]
marketplace = ["ic-platform-protocol/cloud-engine-marketplace"]
registry = ["ic-platform-protocol/registry", "ic-platform-protocol/registry-placement"]
registry-settings = ["ic-platform-protocol/registry-settings"]

[dependencies]
candidate-types.workspace = true
ic-platform-protocol.workspace = true

[dev-dependencies]
candidate-runtime = { workspace = true, features = ["call"] }
serde_json.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
