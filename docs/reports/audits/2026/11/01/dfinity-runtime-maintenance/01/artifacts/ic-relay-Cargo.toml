[workspace]
members = [
    "crates/ic-relay",
    "crates/ic-relay-counter",
    "crates/ic-relay-fixture-support",
    "crates/ic-relay-persistence-probe",
    "crates/ic-relay-test-support",
]
resolver = "3"

[workspace.package]
license-file = "LICENSE"
version = "0.21.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
# Relay workspace
# Changelog: CHANGELOG.md
ic-relay = { version = "0.21.0", path = "crates/ic-relay" }
ic-relay-counter = { version = "0.21.0", path = "crates/ic-relay-counter" }
ic-relay-fixture-support = { version = "0.21.0", path = "crates/ic-relay-fixture-support" }
ic-relay-persistence-probe = { version = "0.21.0", path = "crates/ic-relay-persistence-probe" }
ic-relay-test-support = { version = "0.21.0", path = "crates/ic-relay-test-support" }

# Production dependencies
ic-memory = "0.60.3"
ic-platform = { version = "0.15.3", default-features = false }
ic-platform-types = { version = "0.15.1", default-features = false }
ic-storage = "0.60.3"
ic-timers = "0.35.0"
ic-wire = "0.13.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

# Tests and tooling only
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ic-build = "0.73.3"
ic-host-artifacts = { version = "0.73.3", default-features = false }
ic-host-process = { version = "0.73.3", default-features = false }
ic-host-text = { version = "0.73.3", default-features = false }
ic-metrics = { version = "0.24.1", default-features = false, features = ["native-wire"] }
ic-testkit = "0.75.2"
rustyline = { version = "18.0.1", default-features = false }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

