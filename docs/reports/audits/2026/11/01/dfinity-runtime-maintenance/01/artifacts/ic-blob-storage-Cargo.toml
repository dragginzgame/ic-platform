[workspace]
# Production packages: canisters/standalone and crates/*.
# Tests and tooling packages: canisters/test/*, tests/pocketic and tests/protocol.
members = [
    "canisters/standalone",
    "canisters/test/admission_probe",
    "canisters/test/authority_probe",
    "canisters/test/consumer_probe",
    "canisters/test/funding_probe",
    "canisters/test/gateway_source",
    "canisters/test/storage_probe",
    "crates/ic-blob-storage",
    "crates/ic-blob-storage-cli",
    "crates/ic-blob-storage-client",
    "crates/ic-blob-storage-contracts",
    "tests/pocketic",
    "tests/protocol",
]
resolver = "3"

[workspace.package]
version = "0.63.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
# Production dependencies
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
hex = "0.4.3"
ic-blob-storage = { path = "crates/ic-blob-storage", version = "0.63.0" }
ic-blob-storage-canister = { path = "canisters/standalone", version = "0.63.0" }
ic-blob-storage-cli = { path = "crates/ic-blob-storage-cli", version = "0.63.0" }
ic-blob-storage-client = { path = "crates/ic-blob-storage-client", version = "0.63.0" }
ic-blob-storage-contracts = { path = "crates/ic-blob-storage-contracts", version = "0.63.0", default-features = false }
ic-build = "0.73.4"
ic-host-artifacts = { version = "0.73.4", default-features = false }
ic-host-fs = { version = "0.73.4", default-features = false }
ic-host-http = { version = "0.73.4", default-features = false }
ic-host-process = { version = "0.73.4", default-features = false }
ic-memory = "0.60.6"
ic-metrics = { version = "0.24.3", default-features = false }
ic-platform = { version = "0.16.0", default-features = false }
ic-storage = "0.60.6"
ic-wire = "0.13.3"
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
# PocketIC constrains its own thiserror dependency; the lock retains 2.0.18.
thiserror = "2.0.18"
tokio = "1.54.1"
url = "2.5.8"

# Tests and tooling only
blob-admission-probe = { path = "canisters/test/admission_probe", version = "0.63.0" }
blob-authority-probe = { path = "canisters/test/authority_probe", version = "0.63.0" }
blob-consumer-probe = { path = "canisters/test/consumer_probe", version = "0.63.0" }
blob-funding-probe = { path = "canisters/test/funding_probe", version = "0.63.0" }
blob-gateway-source = { path = "canisters/test/gateway_source", version = "0.63.0" }
blob-storage-probe = { path = "canisters/test/storage_probe", version = "0.63.0" }
blob-test-protocol = { path = "tests/protocol", version = "0.63.0" }
ic-blob-storage-pocketic-tests = { path = "tests/pocketic", version = "0.63.0" }
ic-host-tools = { version = "0.76.0", default-features = false }
ic-testkit = "0.76.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# This workspace owns the standalone/probe products. Consumers keep their own
# release profiles; linking Blob does not select their optimization policy.
[profile.release]
lto = "thin"
codegen-units = 1
