[workspace]
# Production packages: crates/ic-jobs, crates/ic-timers.
# Remaining members are unpublished consumer, test and qualification packages.
members = [
    "apps/ic-jobs-test-consumer",
    "crates/ic-jobs",
    "crates/ic-jobs-canister-test-support",
    "crates/ic-jobs-canister-tests",
    "crates/ic-timers",
    "crates/ic-timers-pocketic",
    "crates/ic-timers-runtime-probe",
    "crates/ic-timers-size-probe",
    "crates/ic-timers-test-protocol",
]
default-members = ["crates/ic-jobs", "crates/ic-timers"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Durable application job policies for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-scheduling"

[workspace.dependencies]
# Jobs
# Changelog : releases/jobs/CHANGELOG.md
ic-jobs = { path = "crates/ic-jobs", version = "0.33.2" }
ic-jobs-canister-test-support = { path = "crates/ic-jobs-canister-test-support", version = "0.33.2" }
ic-jobs-canister-tests = { path = "crates/ic-jobs-canister-tests", version = "0.33.2" }
ic-jobs-test-consumer = { path = "apps/ic-jobs-test-consumer", version = "0.33.2" }

# Timers
# Changelog : releases/timers/CHANGELOG.md
ic-timers = { path = "crates/ic-timers", version = "0.35.2" }
ic-timers-pocketic = { path = "crates/ic-timers-pocketic", version = "0.35.2" }
ic-timers-runtime-probe = { path = "crates/ic-timers-runtime-probe", version = "0.35.2" }
ic-timers-size-probe = { path = "crates/ic-timers-size-probe", version = "0.35.2" }
ic-timers-test-protocol = { path = "crates/ic-timers-test-protocol", version = "0.35.2" }

# Production dependencies
# Metrics, Platform and Serde also serve qualification consumers.
ic-metrics = { version = "0.24.1", default-features = false }
ic-platform = { version = "0.16.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Tests and tooling only
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
ctrlc = "3.5"
ic-build = "0.73.3"
ic-host-artifacts = "0.73.3"
ic-host-fs = { version = "0.73.3", default-features = false }
ic-host-process = { version = "0.73.3", default-features = false }
ic-logging = { version = "0.23.3", default-features = false }
ic-memory = "0.60.6"
ic-storage = "0.60.6"
ic-testkit = "0.76.0"
ic-testkit-native = "0.76.0"
ic-wire = "0.13.3"
ic-wire-endpoint = "0.3.0"
serde_json = "1.0"
serde_test = "1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Preserve the Timers probes' qualified optimization profile.
[profile.timer-probe]
inherits = "release"
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
