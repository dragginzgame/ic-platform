version = "0.21.3"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "Cargo.toml"]

[package.metadata.cargo-machete]
