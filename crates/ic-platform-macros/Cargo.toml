[package]
name = "ic-platform-macros"
version = "0.23.27"
description = "Explicit IC update export generation for the replacement Runtime"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository = "https://github.com/dragginzgame/ic-platform"
documentation = "https://docs.rs/ic-platform-macros"
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
proc-macro = true

[features]
default = []

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
