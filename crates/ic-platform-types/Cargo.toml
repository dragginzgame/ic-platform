[package]
name = "ic-platform-types"
description = "Stable owned IC Principal and Account identities"
version = "0.18.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = []
principal-external = ["dep:ic_principal", "ic_principal/serde"]
principal-self-authenticating = ["dep:sha2_11"]

[dependencies]
crc32fast.workspace = true
data-encoding.workspace = true
ic_principal = { workspace = true, optional = true }
serde = { workspace = true, features = ["alloc"] }
serde_bytes.workspace = true
sha2_11 = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
ic_principal = { workspace = true, features = ["self_authenticating"] }
postcard.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
serde_test.workspace = true

[lints]
workspace = true
