[package]
name = "ic-platform-types"
description = "Stable owned IC Principal and Account identities"
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = []
principal-external = ["dep:ic_principal"]
principal-self-authenticating = ["principal-external", "ic_principal/self_authenticating"]

[dependencies]
crc32fast.workspace = true
data-encoding.workspace = true
ic_principal = { workspace = true, optional = true }
serde = { workspace = true, features = ["alloc"] }
thiserror.workspace = true

[dev-dependencies]
serde_bytes.workspace = true
serde_test.workspace = true

[lints]
workspace = true
