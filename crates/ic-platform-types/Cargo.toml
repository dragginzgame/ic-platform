[package]
name = "ic-platform-types"
description = "Stable owned IC Principal and Account identities"
version = "0.19.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "Cargo.toml"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
principal-self-authenticating = ["dep:ic_principal"]

[dependencies]
crc32fast.workspace = true
data-encoding.workspace = true
ic_principal = { workspace = true, optional = true, features = ["self_authenticating"] }
serde = { workspace = true, features = ["alloc"] }
serde_bytes.workspace = true
thiserror.workspace = true

[dev-dependencies]
ic_principal = { workspace = true, features = ["self_authenticating", "serde"] }
postcard.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
serde_test.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
