[package]
name = "ic-platform"
description = "Controlled Candid and IC runtime dependency boundary"
version = "0.23.5"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = []
blake3 = ["dep:blake3"]
principal = ["dep:ic-platform-types", "dep:serde"]
principal-external = ["principal", "ic-platform-types/principal-external"]
principal-self-authenticating = ["principal", "ic-platform-types/principal-self-authenticating"]
agent = ["principal-external", "dep:ic-agent"]
ic-protocol = ["principal-external", "certification-cbor", "dep:ic-transport-types"]
ic-protocol-fixtures = ["ic-protocol"]
bls = ["dep:ic-verify-bls-signature", "dep:ic_bls12_381"]
candid = ["principal-external", "dep:candid", "candid/bignum"]
candid-endpoint = ["cdk", "candid"]
candid-parser = ["principal-external", "dep:candid_parser"]
candid-service = ["candid", "candid/printer"]
cmc-types = ["candid"]
icp-ledger-types = ["candid", "dep:crc32fast", "dep:sha2"]
cycles-ledger-types = ["candid"]
nns-registry-types = ["candid"]
certified-assets-types = ["candid"]
canister-sig-creation = ["principal-external", "certification", "dep:ic-canister-sig-creation"]
cdk = ["runtime", "dep:ic-platform-macros"]
runtime = ["principal", "executor", "ic0", "ic-platform-runtime/runtime"]
certification = ["dep:ic-certification"]
certification-cbor = [
    "certification",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_cbor",
    "dep:thiserror",
]
ecdsa = ["dep:crypto-bigint", "dep:k256"]
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
executor = ["ic0", "ic-platform-runtime/executor"]
ic0 = ["dep:ic-platform-runtime", "ic-platform-runtime/ic0"]
icrc-ledger-types = [
    "dep:crc32fast",
    "dep:data-encoding",
    "principal-external",
    "dep:candid",
    "candid/bignum",
    "candid/serde_bytes",
    "dep:hex",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:serde_bytes",
    "dep:sha2",
]
management-canister-types = [
    "principal-external",
    "dep:candid",
    "candid/bignum",
    "candid/serde_bytes",
    "dep:serde_bytes",
    "dep:ic-management-canister-types",
]
signature-verification = [
    "bls",
    "canister-sig-creation",
    "dep:serde_bytes",
    "dep:serde_cbor",
    "dep:ic-signature-verification",
]
secp256k1 = ["principal-external", "dep:ic-secp256k1"]

[dependencies]
blake3 = { workspace = true, optional = true }
candid = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
crypto-bigint = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ic-canister-sig-creation = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-platform-macros = { workspace = true, optional = true }
ic-platform-runtime = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }
ic-signature-verification = { workspace = true, optional = true }
ic-verify-bls-signature = { workspace = true, optional = true }
ic_bls12_381 = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["alloc"] }
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
candid_parser = { workspace = true, optional = true }
ic-agent = { workspace = true, optional = true }
ic-management-canister-types = { workspace = true, optional = true }
ic-secp256k1 = { workspace = true, optional = true }
ic-transport-types = { workspace = true, optional = true }

[dev-dependencies]
serde_bytes.workspace = true
serde_cbor.workspace = true

[[test]]
name = "blake3_consumer"
path = "tests/blake3_consumer.rs"
required-features = ["blake3"]

[[test]]
name = "executor_consumer"
path = "tests/executor_consumer.rs"
required-features = ["executor", "ic0"]

[[test]]
name = "ecdsa_consumer"
path = "tests/ecdsa_consumer.rs"
required-features = ["ecdsa"]

[[test]]
name = "ed25519_consumer"
path = "tests/ed25519_consumer.rs"
required-features = ["ed25519"]

[[test]]
name = "cdk_consumer"
path = "tests/cdk_consumer.rs"
required-features = ["cdk"]

[[test]]
name = "runtime_consumer"
path = "tests/runtime_consumer.rs"
required-features = ["runtime"]

[[test]]
name = "secp256k1_consumer"
path = "tests/secp256k1_consumer.rs"
required-features = ["secp256k1"]

[[test]]
name = "secp256k1_identity"
path = "tests/secp256k1_identity.rs"
required-features = ["secp256k1"]

[[test]]
name = "bls_consumer"
path = "tests/bls_consumer.rs"
required-features = ["bls"]

[[test]]
name = "canister_sig_consumer"
path = "tests/canister_sig_consumer.rs"
required-features = ["canister-sig-creation"]

[[test]]
name = "signature_consumer"
path = "tests/signature_consumer.rs"
required-features = ["signature-verification"]

[[test]]
name = "agent_consumer"
path = "tests/agent_consumer.rs"
required-features = ["agent", "certification"]

[[test]]
name = "candid_consumer"
path = "tests/candid_consumer.rs"
required-features = ["candid"]

[[test]]
name = "nesting_consumer"
path = "tests/nesting_consumer.rs"
required-features = ["candid"]

[[test]]
name = "service_consumer"
path = "tests/service_consumer.rs"
required-features = ["candid-service"]

[[test]]
name = "dynamic_consumer"
path = "tests/dynamic_consumer.rs"
required-features = ["candid", "candid-parser"]

[[test]]
name = "ic0_consumer"
path = "tests/ic0_consumer.rs"
required-features = ["ic0"]

[[test]]
name = "icrc_consumer"
path = "tests/icrc_consumer.rs"
required-features = ["icrc-ledger-types", "candid"]

[[test]]
name = "icrc10_types_consumer"
path = "tests/icrc10_types_consumer.rs"
required-features = ["icrc-ledger-types"]

[[test]]
name = "external_candid_consumer"
path = "tests/external_candid_consumer.rs"
required-features = ["cdk", "candid-service"]

[[test]]
name = "management_consumer"
path = "tests/management_consumer.rs"
required-features = ["management-canister-types", "candid"]

[[test]]
name = "parser_consumer"
path = "tests/parser_consumer.rs"
required-features = ["candid-parser"]

[[test]]
name = "certification_consumer"
path = "tests/certification_consumer.rs"
required-features = ["certification"]

[[test]]
name = "principal"
path = "tests/principal.rs"
required-features = ["principal"]

[[test]]
name = "parser_properties"
path = "tests/parser_properties.rs"
required-features = ["principal-external"]

[[test]]
name = "principal_external_consumer"
path = "tests/principal_external_consumer.rs"
required-features = ["principal-external"]

[[test]]
name = "principal_self_authenticating_consumer"
path = "tests/principal_self_authenticating_consumer.rs"
required-features = ["principal-self-authenticating"]

[[test]]
name = "external_contract_consumer"
path = "tests/external_contract_consumer.rs"
required-features = ["cmc-types", "cycles-ledger-types", "icp-ledger-types", "nns-registry-types"]

[[test]]
name = "asset_contract_consumer"
path = "tests/asset_contract_consumer.rs"
required-features = ["certified-assets-types"]

[[test]]
name = "external_contract_schema"
path = "tests/external_contract_schema.rs"
required-features = [
    "icrc-ledger-types",
    "cmc-types",
    "cycles-ledger-types",
    "icp-ledger-types",
    "nns-registry-types",
    "certified-assets-types",
    "candid-parser",
]

[[test]]
name = "upstream_dto_identity"
path = "tests/upstream_dto_identity.rs"
required-features = ["management-canister-types", "icrc-ledger-types"]

[[test]]
name = "protocol_consumer"
path = "tests/protocol_consumer.rs"
required-features = [
    "candid",
    "management-canister-types",
    "cmc-types",
    "icp-ledger-types",
    "icrc-ledger-types",
    "nns-registry-types",
    "cycles-ledger-types",
    "certified-assets-types",
]

[[test]]
name = "candid_endpoint_consumer"
path = "tests/candid_endpoint_consumer.rs"
required-features = ["candid-endpoint", "candid-service"]

[[test]]
name = "cbor_malformed"
required-features = ["ic-protocol"]

[[test]]
name = "icp_account_identifier_consumer"
required-features = ["icp-ledger-types"]

[lints]
workspace = true
