[package]
name = "ic-platform"
version = "0.35.0"
description = "Explicit IC certificate and authentication boundaries"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository = "https://github.com/dragginzgame/ic-platform"
documentation = "https://docs.rs/ic-platform"
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["toko-tooling", "crypto-bigint"]

[features]
default = []
ingress-packets = [
    "dep:ic-platform-types",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_cbor",
    "dep:ic-transport-types",
    "dep:thiserror",
]
native-signed-secp256k1 = ["native-signed", "ecdsa", "k256/pem"]
native-signed = [
    "native-read",
    "ingress-packets",
    "ed25519-dalek/pem",
    "ed25519-dalek/zeroize",
    "ic-platform-types/principal-self-authenticating",
]
native-read = [
    "certificate-authentication",
    "ed25519",
    "dep:ic-transport-types",
    "dep:reqwest",
]
certificate-construction = [
    "certificate-decode",
    "dep:ic-platform-types",
    "dep:serde_bytes",
    "ic-certification/serde",
]
certificate-fixture-signing = ["dep:ic-verify-bls-signature"]
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
ecdsa = ["dep:k256", "dep:crypto-bigint"]
certificate-decode = ["dep:ic-certification", "dep:serde", "dep:serde_cbor", "dep:thiserror"]

canister-signature-decode = ["certificate-decode"]
canister-signature-authentication = [
    "canister-signature-decode",
    "certificate-authentication",
    "dep:sha2",
    "dep:spki",
]

certificate-authentication = ["certificate-decode", "dep:ic-platform-types", "dep:ic-verify-bls-signature"]

[dependencies]
# Security floor for K256's compatible transitive graph (RUSTSEC-2026-0387).
# This deliberately constrains resolution without copying or calling arithmetic.
crypto-bigint = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }
ic-verify-bls-signature = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
spki = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-transport-types = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
ic_bls12_381.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
