[package]
name = "ic-platform"
description = "Controlled Candid and IC runtime dependency boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
# Preserve the executor's Cargo singleton guard, including against the old supplier.
links = "ic-cdk async executor, see https://github.com/dfinity/cdk-rs/blob/links-pin/TROUBLESHOOTING.md"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml", "build.rs"]

[features]
default = []
blake3 = ["dep:blake3"]
principal = ["dep:crc32fast", "dep:data-encoding", "dep:serde", "dep:thiserror"]
principal-external = ["principal", "dep:ic_principal"]
principal-self-authenticating = ["principal-external", "ic_principal/self_authenticating"]
agent = ["principal-external", "dep:ic-agent"]
bls = ["dep:ic-verify-bls-signature"]
candid = ["principal-external", "dep:candid", "candid/bignum"]
candid-endpoint = ["cdk", "candid"]
candid-parser = ["principal-external", "dep:candid_parser"]
candid-service = ["candid", "candid/printer"]
cmc-types = ["candid"]
icp-ledger-types = ["candid"]
cycles-ledger-types = ["candid"]
nns-registry-types = ["candid"]
certified-assets-types = ["candid"]
canister-sig-creation = ["principal-external", "dep:ic-certification", "dep:sha2"]
cdk = ["runtime", "dep:ic-platform-macros"]
runtime = ["principal", "executor", "ic0", "dep:pin-project-lite", "dep:thiserror"]
certification = ["dep:ic-certification"]
ecdsa = ["dep:k256"]
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
executor = ["ic0", "dep:slotmap"]
gzip = ["dep:ic-host-artifacts"]
ic0 = []
icrc-ledger-types = [
    "principal-external",
    "dep:candid",
    "candid/bignum",
    "candid/serde_bytes",
    "dep:hex",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:serde_bytes",
    "dep:sha2",
]
management-canister-types = ["principal-external", "dep:candid", "candid/bignum", "candid/serde_bytes", "dep:serde_bytes", "dep:ic-management-canister-types"]
signature-verification = [
    "canister-sig-creation",
    "ic_principal/serde",
    "dep:ic-verify-bls-signature",
    "dep:serde_bytes",
    "dep:serde_cbor",
]
pocket-ic = ["principal-external", "dep:pocket-ic"]
secp256k1 = ["principal-external", "dep:ic-secp256k1"]
stable-structures = ["dep:ic-stable-structures"]
wire-schema = ["principal", "dep:ic-wire-metadata", "dep:serde_json"]

[dependencies]
blake3 = { workspace = true, optional = true }
candid = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-platform-macros = { workspace = true, optional = true }
ic-stable-structures = { workspace = true, optional = true }
ic-verify-bls-signature = { workspace = true, optional = true }
ic_principal = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["alloc"] }
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
slotmap = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-management-canister-types = { workspace = true, optional = true }
candid_parser = { workspace = true, optional = true }
ic-agent = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
ic-secp256k1 = { workspace = true, optional = true }
ic-wire-metadata = { workspace = true, optional = true }
pocket-ic = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
assert_matches.workspace = true
ic-representation-independent-hash.workspace = true
serde_bytes.workspace = true
serde_cbor.workspace = true
serde_test.workspace = true

[[test]]
name = "gzip_consumer"
path = "tests/gzip_consumer.rs"
required-features = ["gzip"]

[[test]]
name = "blake3_consumer"
path = "tests/blake3_consumer.rs"
required-features = ["blake3"]

[[test]]
name = "executor_consumer"
path = "tests/executor_consumer.rs"
required-features = ["executor", "ic0"]

[[test]]
name = "ecdsa_consumer"
path = "tests/ecdsa_consumer.rs"
required-features = ["ecdsa"]

[[test]]
name = "ed25519_consumer"
