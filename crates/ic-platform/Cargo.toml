[package]
name = "ic-platform"
description = "Controlled Candid and IC runtime dependency boundary"
version = "0.32.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "Cargo.toml"]

[package.metadata.cargo-machete]
# Constrains K256's transitive bigint to the published ECDSA security floor.
ignored = ["crypto-bigint", "toko-tooling"]

[features]
default = []
principal = ["dep:ic-platform-types", "dep:serde"]
principal-self-authenticating = ["principal", "ic-platform-types/principal-self-authenticating"]
candid-args = []
candid-codec = ["principal", "dep:num-bigint", "num-bigint/serde"]
raw-rand = ["candid-args"]
agent = ["principal", "dep:ic-agent"]
ic-protocol = ["principal", "certification-cbor", "dep:ic-transport-types"]
ic-protocol-fixtures = ["ic-protocol"]
bls = ["dep:ic_bls12_381", "dep:digest_10", "dep:sha2_11"]
candid-codec-endpoint = ["runtime", "candid-codec", "candid-args", "dep:ic-platform-macros"]
cmc-types = ["candid-codec", "principal"]
icp-ledger-types = ["candid-codec", "principal", "dep:crc32fast", "dep:sha2_11"]
cycles-ledger-types = ["candid-codec", "principal"]
nns-registry-types = ["candid-codec", "principal"]
certified-assets-types = ["candid-codec"]
canister-sig-creation = ["principal", "certification", "dep:sha2_11"]
runtime = ["principal", "executor", "ic0", "ic-platform-runtime/runtime"]
certification = ["dep:ic-certification"]
certification-cbor = [
    "certification",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_cbor",
    "dep:thiserror",
]
ecdsa = ["dep:crypto-bigint", "dep:k256"]
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
executor = ["ic0", "ic-platform-runtime/executor"]
ic0 = ["dep:ic-platform-runtime", "ic-platform-runtime/ic0"]
icrc-ledger-types = [
    "dep:crc32fast",
    "dep:data-encoding",
    "principal",
    "candid-codec",
    "dep:hex",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:serde_bytes",
    "dep:sha2_11",
]
management-canister-types = ["principal", "candid-codec", "dep:serde_bytes"]
signature-verification = [
    "bls",
    "canister-sig-creation",
    "dep:serde_bytes",
    "dep:serde_cbor",
    "dep:thiserror",
]

[dependencies]
crc32fast = { workspace = true, optional = true }
crypto-bigint = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
digest_10 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-platform-macros = { workspace = true, optional = true }
ic-platform-runtime = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }
ic_bls12_381 = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["alloc"] }
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
sha2_11 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-agent = { workspace = true, optional = true }
ic-transport-types = { workspace = true, optional = true }

[dev-dependencies]
binrw.workspace = true
candid = { workspace = true, features = ["serde_bytes", "value"] }
# Independent byte/schema oracles, never production codec dependencies.
ic-canister-sig-creation.workspace = true
ic-management-canister-types.workspace = true
ic-signature-verification.workspace = true
ic-verify-bls-signature.workspace = true
serde_bytes.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
toko-tooling.workspace = true

[[test]]
name = "candid_declarations_consumer"
required-features = ["candid-codec"]

[[test]]
name = "candid_codec_consumer"
path = "tests/candid_codec_consumer.rs"
required-features = ["candid-codec"]

[[test]]
name = "candid_args_consumer"
path = "tests/candid_args_consumer.rs"
required-features = ["candid-args"]

[[test]]
name = "raw_rand_consumer"
path = "tests/raw_rand_consumer.rs"
required-features = ["raw-rand"]

[[test]]
name = "executor_consumer"
path = "tests/executor_consumer.rs"
required-features = ["executor", "ic0"]

[[test]]
name = "ecdsa_consumer"
path = "tests/ecdsa_consumer.rs"
required-features = ["ecdsa"]

[[test]]
name = "ed25519_consumer"
path = "tests/ed25519_consumer.rs"
