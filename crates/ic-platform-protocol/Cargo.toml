[package]
name = "ic-platform-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Bounded external protocol formats for IC Platform"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
cloud-engine = []
cloud-engine-response = ["cloud-engine", "dep:ic-platform-types", "dep:serde"]
cloud-engine-marketplace = ["cloud-engine-response", "dep:num-bigint"]
registry-settings = ["dep:serde"]

[dependencies]
ic-platform-types = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
