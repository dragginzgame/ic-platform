[package]
name = "ic-platform-protocol"
version = "0.2.7"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository = "https://github.com/dragginzgame/ic-platform"
documentation = "https://docs.rs/ic-platform-protocol"
readme = "README.md"
description = "Bounded external protocol formats for IC Platform"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
management = ["management-snapshots", "dep:num-bigint"]
ledger = ["management", "dep:sha2", "dep:crc32fast"]
caffeine = ["dep:candidate-types", "dep:serde", "dep:num-bigint"]
raw-rand = []
management-chunks = ["dep:candidate-types", "dep:serde"]
management-snapshots = ["dep:candidate-types", "dep:serde"]
http-request = []
cloud-engine = []
cloud-engine-response = ["cloud-engine", "dep:candidate-types", "dep:serde"]
cloud-engine-marketplace = ["cloud-engine-response", "dep:num-bigint"]
registry-placement = ["cloud-engine-response"]
registry = ["registry-settings"]
registry-settings = ["dep:serde"]

[dependencies]
candidate-types = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[lints]
workspace = true
