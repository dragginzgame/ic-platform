[package]
name = "ic-platform-runtime"
description = "Canonical IC system API, executor and raw call runtime"
version = "0.22.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "README.md", "Cargo.toml"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
ic0 = ["dep:ic0"]
executor = ["ic0", "dep:slotmap", "dep:ic-platform-runtime-guard"]
runtime = [
    "executor",
    "dep:ic-platform-types",
    "dep:pin-project-lite",
    "dep:serde",
    "dep:thiserror",
]
cdk = ["runtime", "dep:ic-platform-macros"]

[dependencies]
ic-platform-macros = { workspace = true, optional = true }
ic-platform-runtime-guard = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }
ic0 = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["alloc"] }
slotmap = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
serde_test.workspace = true
toko-tooling.workspace = true

[[test]]
name = "cdk_consumer"
path = "tests/cdk_consumer.rs"
required-features = ["cdk"]

[[test]]
name = "executor_consumer"
path = "tests/executor_consumer.rs"
required-features = ["executor"]

[[test]]
name = "call_consumer"
path = "tests/call_consumer.rs"
required-features = ["runtime"]

[lints]
workspace = true
