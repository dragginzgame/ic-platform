[package]
name = "ic-platform-runtime"
version = "0.23.22"
description = "Explicit call ownership for the IC Platform replacement"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository = "https://github.com/dragginzgame/ic-platform"
documentation = "https://docs.rs/ic-platform-runtime"
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
system-raw = []
raw-rand = ["call-ic0", "dep:ic-platform-protocol", "ic-platform-protocol/raw-rand"]
call = ["dep:ic-platform-types"]
call-ic0 = ["call", "dep:ic-platform-runtime-guard"]
entrypoint-macros = ["call-ic0", "dep:ic-platform-macros"]

[dependencies]
ic-platform-macros = { workspace = true, optional = true }
ic-platform-protocol = { workspace = true, optional = true }
ic-platform-runtime-guard = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
