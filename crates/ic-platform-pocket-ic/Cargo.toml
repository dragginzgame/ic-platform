[package]
name = "ic-platform-pocket-ic"
version = "0.20.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Independently maintained native PocketIC client"
publish = ["crates-io"]
include = ["src/**", "upstream/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []

[target.'cfg(not(target_family = "wasm"))'.dependencies]
backon = { workspace = true }
base64 = { workspace = true }
candid = { workspace = true, features = ["bignum", "serde_bytes", "printer"] }
flate2 = { workspace = true }
hex = { workspace = true, features = ["serde"] }
ic-certification = { workspace = true }
ic-management-canister-types = { workspace = true }
ic-transport-types = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "http2", "json", "multipart", "rustls", "socks", "stream"] }
schemars = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
slog = { workspace = true, features = ["max_level_trace", "nested-values", "release_max_level_trace"] }
strum = { workspace = true }
strum_macros = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
